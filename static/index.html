<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentBoard</title>
  <link rel="stylesheet" href="/static/style.css">

</head>
<body>
<button id="menu-toggle">☰</button>
<div id="sidebar-overlay"></div>

<nav id="sidebar">
  <div class="sb-brand">Agent<span>Board</span></div>
  <div class="sb-search"><input id="global-search" placeholder="Search… ⌘K"></div>
  <a href="#overview" class="sb-home-link">🏠 Dashboard</a>
  <div class="sb-sec">Projects</div>
  <div id="sb-projects"></div>
  <div id="sb-add-proj"></div>
  <div class="sb-sec">System</div>
  <a href="#docs">📄 Docs</a>
  <a href="#inbox" id="sb-inbox-link">💬 Inbox <span id="sb-inbox-badge" class="msg-badge" style="display:none">0</span></a>
  <a href="#discussions">💬 Discussions</a>
  <a href="#plans">📋 Plans</a>
  <a href="#activity" id="sb-activity">📋 Activity</a>
  <a href="#settings" id="sb-settings">⚙️ Settings</a>
  <!-- Hidden WIP features — accessible via direct URL -->
  <a href="#analytics" id="sb-analytics" style="display:none">📊 Analytics</a>
  <a href="#agents" id="sb-agents" style="display:none">🤖 Agents</a>
  <div class="sb-foot">
    <div id="sb-auth-row">
      <span id="sb-auth-icon" title="Click to manage API key">🔓</span>
      <input id="sb-key-input" type="password" placeholder="API Key…">
      <button id="sb-key-btn" onclick="sidebarAuth()" title="Save API key">→</button>
      <button id="sb-key-logout" onclick="sidebarLogout()" title="Remove key" style="display:none">✕</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
      <span id="sb-ver" style="font-size:11px;color:var(--t2)">…</span>
      <a id="sb-github" href="https://github.com/ajianaz/agentboard" target="_blank" rel="noopener" title="GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </div>
</nav>

<main id="app"></main>

<div class="panel-bg" id="panel-bg"></div>
<div class="panel" id="task-panel"></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<div id="toast-c"></div>
  <!-- JS modules (order matters) -->
  <script src="/static/js/base.js"></script>
  <script src="/static/js/task-panel.js"></script>
  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/router.js"></script>
  <script src="/static/js/views-overview.js"></script>
  <script src="/static/js/views-board.js"></script>
  <script src="/static/js/views-docs.js"></script>
  <script src="/static/js/views-settings.js"></script>
  <script src="/static/js/discussions.js"></script>
  <script src="/static/js/plans.js"></script>
  <script src="/static/js/activity.js"></script>
  <script src="/static/js/init.js"></script>

</body>
</html>
